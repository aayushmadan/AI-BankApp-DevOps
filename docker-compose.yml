# docker run -d -p 3306:3306 --network=bankapp -v mysql-data:/var/lib/mysql -e MYSQL_DATABASE="bankappdb" -e MYSQL_ROOT_PASSWORD=Test@123 mysql

# docker build && docker run
services:
  mysql:
    image: mysql:8.0
    container_name: bankapp-mysql
    environment:
      MYSQL_ROOT_PASSWORD: Test@123
      MYSQL_DATABASE: bankappdb
    ports:
      - "3306:3306"
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s # Test every after 10s
      timeout: 5s # Wait till 5s for response
      retries: 5 # Retry 5 times
      start_period: 30s
    volumes:
      - "mysql-data:/var/lib/mysql"
    networks:
      - bankapp-net

  ollama:
    image: ollama/ollama
    container_name: bankapp-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - bankapp-net

  bankapp:
    build: .
    container_name: bankapp
    ports:
      - "8080:8080"
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: bankappdb
      MYSQL_USER: root
      MYSQL_PASSWORD: Test@123
      OLLAMA-URL: http://ollama:11434
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - bankapp-net

# docker network create
networks:
  bankapp-net:
    driver: bridge

# docker volume create
volumes:
  mysql-data:
  ollama-data:
