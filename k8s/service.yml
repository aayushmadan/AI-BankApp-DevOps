kind: Service
apiVersion: v1
# type: ClusterIP

metadata:
  name: mysql-service
  namespace: bankapp

spec:
  selector:
    app: mysql
  ports:
    - port: 3306

---

kind: Service
apiVersion: v1

metadata:
  name: bankapp-service
  namespace: bankapp

spec:
  selector:
    app: bankapp
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600 # 1 hour
  ports:
    - port: 8080
      targetPort: 8080
  type: NodePort

---

kind: Service
apiVersion: v1

metadata:
  name: ollama-service
  namespace: bankapp

spec:
  selector:
    app: ollama
  ports:
    - port: 11434

